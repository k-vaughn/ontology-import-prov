site_name: W3C Provenance Ontology
site_description: The W3C provenance ontology converted into a website
repo_url: https://github.com/ISO-TC204/ontology-import-prov
nav:
- Home: index.md
- prov:
  - prov: prov.md
  - Accept: Accept.md
  - Activity: Activity.md
  - Activity Influence: ActivityInfluence.md
  - Agent: Agent.md
  - Agent Influence: AgentInfluence.md
  - Association: Association.md
  - Attribution: Attribution.md
  - Bundle: Bundle.md
  - Collection: Collection.md
  - Communication: Communication.md
  - Contribute: Contribute.md
  - Contributor: Contributor.md
  - Copyright: Copyright.md
  - Create: Create.md
  - Creator: Creator.md
  - Delegation: Delegation.md
  - Derivation: Derivation.md
  - Dictionary: Dictionary.md
  - Direct Query Service: DirectQueryService.md
  - Empty Collection: EmptyCollection.md
  - Empty Dictionary: EmptyDictionary.md
  - End: End.md
  - Entity: Entity.md
  - Entity Influence: EntityInfluence.md
  - Generation: Generation.md
  - Influence: Influence.md
  - Insertion: Insertion.md
  - Instantaneous Event: InstantaneousEvent.md
  - Invalidation: Invalidation.md
  - Key Entity Pair: KeyEntityPair.md
  - Location: Location.md
  - Modify: Modify.md
  - Organization: Organization.md
  - Person: Person.md
  - Plan: Plan.md
  - Primary Source: PrimarySource.md
  - Publish: Publish.md
  - Publisher: Publisher.md
  - Quotation: Quotation.md
  - Removal: Removal.md
  - Replace: Replace.md
  - Revision: Revision.md
  - Rights Assignment: RightsAssignment.md
  - Rights Holder: RightsHolder.md
  - Role: Role.md
  - Service Description: ServiceDescription.md
  - Software Agent: SoftwareAgent.md
  - Start: Start.md
  - Submit: Submit.md
  - Usage: Usage.md
site_url: https://isotc204.org/ontology-import-prov
copyright: <p xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/">
  <a href="https://creativecommons.org/licenses/by/4.0/?ref=chooser-v1" target="_blank"
  rel="license noopener noreferrer" style="display:inline-block;">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;"
  src="https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1" alt=""><img
  style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg?ref=chooser-v1"
  alt=""></a></p>
theme:
  name: material
  features:
  - content.code.copy
  - content.status
  - content.tooltips
  - icons
  - navigation.path
  - navigation.top
  icon:
    repo: fontawesome/brands/github
    admonition:
      question: fontawesome/solid/comments
  palette:
  - scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
extra_css:
- stylesheets/extra.css
extra_javascript:
- https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
- javascripts/tablesort.js
plugins:
- search
- git-revision-date-localized:
    type: date
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- md_in_html
- meta
- footnotes
- pymdownx.blocks.caption
- pymdownx.details
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
    use_pygments: true
- pymdownx.inlinehilite
- pymdownx.snippets:
    base_path: docs
    check_paths: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: ''
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true
extra:
  search:
    highlight: true
  hide:
  - title
  version:
    provider: mike
    alias: true
    default: latest
